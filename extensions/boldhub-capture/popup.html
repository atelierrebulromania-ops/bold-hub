<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>BoldHub Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon-32.png" alt="" width="22" height="22">
    <div><strong>BoldHub Capture</strong><span id="who">Contabilitate</span></div>
    <button type="button" id="menu-button" class="icon-button" aria-label="Setări" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
    </button>
  </header>

  <!-- Not paired yet -->
  <section id="view-connect" class="view" hidden>
    <h1>Conectează BoldHub</h1>
    <p class="lead">Extensia primește o cheie limitată la încărcarea documentelor, valabilă 90 de zile. Nu păstrează parole.</p>
    <label class="field">Server
      <select id="server">
        <option value="https://www.boldhub.ro">www.boldhub.ro</option>
        <option value="http://localhost:3001">localhost:3001 (dezvoltare)</option>
      </select>
    </label>
    <button type="button" id="connect" class="primary">Conectează BoldHub</button>
    <details class="manual-key">
      <summary>Am deja o cheie</summary>
      <label class="field">Cheie BoldHub Capture<input id="manual-token" autocomplete="off" spellcheck="false" placeholder="bhc_…"></label>
      <button type="button" id="save-token" class="secondary">Salvează cheia</button>
    </details>
    <p id="connect-error" class="message error" hidden></p>
  </section>

  <!-- Paired -->
  <section id="view-capture" class="view" hidden>
    <div class="source">
      <span class="dot" id="source-dot"></span>
      <div><strong id="source-name">Se detectează…</strong><span id="source-host"></span></div>
    </div>

    <div class="block">
      <div class="block-title">Document</div>
      <div id="candidates" class="candidates"></div>
      <label class="file-pick">
        <input type="file" id="file" accept=".pdf,.csv,.xlsx,application/pdf,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        <span id="file-label">Alege un fișier de pe calculator (PDF, CSV, XLSX)</span>
      </label>
    </div>

    <div class="grid">
      <label class="field">Companie<select id="company"></select></label>
      <label class="field">Furnizor<select id="supplier"></select></label>
      <label class="field">Tip document<select id="doc-type">
        <option value="external_invoice">Factură externă</option>
        <option value="shopify_fees_invoice">Factură comisioane Shopify Payments</option>
        <option value="shopify_payout_report">Raport Shopify Payout</option>
        <option value="other">Alt document contabil</option>
      </select></label>
      <label class="field">Perioadă<input type="month" id="period"></label>
      <label class="field">Nr. factură <em>opțional</em><input id="invoice-number" maxlength="80"></label>
      <label class="field">Data emiterii <em>opțional</em><input type="date" id="issued-on"></label>
    </div>

    <button type="button" id="send" class="primary" disabled>Trimite în BoldHub</button>
    <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
    <div id="result" class="message" hidden></div>
  </section>

  <section id="view-menu" class="view" hidden>
    <h1>Setări</h1>
    <p class="lead" id="menu-info"></p>
    <button type="button" id="open-boldhub" class="secondary">Deschide Contabilitate</button>
    <button type="button" id="disconnect" class="secondary danger">Deconectează extensia</button>
    <button type="button" id="menu-back" class="link">Înapoi</button>
  </section>

  <section id="view-loading" class="view"><p class="lead">Se încarcă…</p></section>
  <script src="popup.js" type="module"></script>
</body>
</html>
